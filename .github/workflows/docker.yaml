name: Release to Docker

permissions:
  contents: read

# Controls when the action will run.
on:
  workflow_dispatch:
  push:
    branches:
      - master # publish to 'master' tag
    tags:
      - 'v*.*.*' # publish on version tags, updates 'latest' tag
jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Base version of the fork (version/version.go), so that master builds carry it too:
      # v1.13.7-<short sha>. Release tags (v1.13.7-argon.N) come from the git tag via semver below.
      - name: Resolve base version
        id: version
        run: |
          base=$(grep -o 'Version = "[^"]*"' version/version.go | cut -d'"' -f2)
          test -n "$base"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/${{ github.repository }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=branch
            type=raw,value=v${{ steps.version.outputs.base }}-{{sha}},enable={{is_default_branch}}
            # {{raw}} keeps the git tag as-is (v1.13.7-argon.1); with v{{version}} a pre-release tag lost its "v"
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha

      # Generate with the same Go toolchain the published image is built with
      - name: Resolve Go version
        id: go-version
        run: |
          # Assign first so a failed lookup trips `set -e`; inside echo its exit
          # status would be discarded and an empty version written.
          version=$(.github/scripts/go-version.sh Dockerfile)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.go-version.outputs.version }}

      - name: Download Go modules
        run: go mod download

      # Run mage at the version go.mod pins, rather than the mage-action's
      # `version: latest`, so the binary matches the mage/mg library the magefile is
      # compiled against and Renovate owns the version like any other module.
      - name: Generate code
        run: go run github.com/magefile/mage generate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No buildx cache on purpose: the Dockerfile's `apk upgrade` layer relies on a
      # cold cache to pick up Alpine security patches.
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
